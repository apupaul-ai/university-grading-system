<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Grading System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233F;
    --navy-deep: #0C1526;
    --gold: #C9A227;
    --gold-bright: #E6C158;
    --gold-soft: #EFE2B8;
    --paper: #FAF7F0;
    --paper-line: #E5DFCF;
    --ink: #23282F;
    --ink-soft: #6B7280;
    --green: #3F6B4F;
    --red: #A6483B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 30px;
    color: var(--ink);
    padding-bottom: 60px;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 0 14px; }

  /* ---- Masthead banner ---- */
  .masthead {
    background: var(--navy);
    background-image: radial-gradient(circle at 15% 20%, rgba(201,162,39,0.12), transparent 45%),
                       radial-gradient(circle at 85% 80%, rgba(201,162,39,0.10), transparent 45%);
    padding: 34px 16px 26px;
    text-align: center;
    position: relative;
    border-bottom: 3px solid var(--gold);
    animation: fadeSlideDown 0.6s ease both;
  }
  .masthead::before, .masthead::after {
    content: "";
    position: absolute; left: 0; right: 0; height: 1px;
    background: rgba(230,193,88,0.35);
  }
  .masthead::before { top: 8px; }
  .masthead::after { bottom: 8px; }

  .seal {
    width: 52px; height: 52px; margin: 0 auto 12px;
    animation: sealPop 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s both;
  }

  .masthead .eyebrow {
    font-family: 'Roboto Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-bright);
    display: block;
    margin-bottom: 8px;
  }
  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-size: 27px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .masthead p {
    font-size: 12.5px;
    color: rgba(255,255,255,0.6);
    margin-top: 6px;
    font-style: italic;
  }

  .content-wrap { padding-top: 18px; animation: fadeSlideUp 0.5s ease 0.1s both; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #fff; border: 1px solid var(--paper-line); border-radius: 8px; padding: 4px; box-shadow: 0 1px 3px rgba(22,35,63,0.06); }
  .tab-btn {
    flex: 1; padding: 9px; border: none; border-radius: 6px;
    background: transparent; font-family: 'Inter'; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.2px; cursor: pointer; color: var(--ink-soft);
    transition: background 0.18s, color 0.18s;
  }
  .tab-btn:hover { color: var(--navy); }
  .tab-btn.active { background: var(--navy); color: var(--gold-soft); }

  .card {
    background: #fff; border: 1px solid var(--paper-line); border-radius: 10px;
    padding: 20px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(22,35,63,0.05);
    animation: fadeIn 0.4s ease both;
  }
  .hidden { display: none !important; }

  .section-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--paper-line); }

  label { font-size: 12.5px; color: var(--ink-soft); display: block; margin-bottom: 5px; font-weight: 500; }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--paper-line); border-radius: 6px;
    font-size: 14px; margin-bottom: 12px; font-family: 'Inter'; background: var(--paper);
    transition: border-color 0.15s, background 0.15s;
  }
  input:focus { outline: none; border-color: var(--gold); background: #fff; }

  .semester-block { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 8px; padding: 13px; margin-bottom: 12px; }
  .semester-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .semester-header span { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; color: var(--navy); }
  .link-btn { background: none; border: none; color: var(--navy); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .link-btn.danger { color: var(--red); }

  .subject-row { display: grid; grid-template-columns: 1fr 72px 24px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .subject-row input { margin-bottom: 0; }

  .btn { border: none; border-radius: 6px; padding: 11px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'Inter'; letter-spacing: 0.2px; transition: transform 0.12s, background 0.15s; }
  .btn:active { transform: scale(0.98); }
  .btn-secondary { background: var(--paper); border: 1px dashed #C9BFA0; color: var(--navy); width: 100%; margin-bottom: 12px; }
  .btn-secondary:hover { background: #F3EEDF; }
  .btn-primary { background: var(--navy); color: var(--gold-soft); width: 100%; box-shadow: 0 2px 8px rgba(22,35,63,0.25); }
  .btn-primary:hover { background: var(--navy-deep); }
  .btn-danger { background: #FBEEEC; color: var(--red); width: 100%; }
  .btn-danger:hover { background: #F6DEDA; }

  .student-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 14px; border: 1px solid var(--paper-line); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    background: #fff; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    border-left: 3px solid transparent;
  }
  .student-item:hover { border-left-color: var(--gold); transform: translateX(2px); box-shadow: 0 2px 8px rgba(22,35,63,0.08); }
  .student-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--navy); }
  .student-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .student-cgpa { font-family: 'Roboto Mono', monospace; font-size: 15px; color: var(--navy); font-weight: 600; background: var(--gold-soft); padding: 3px 9px; border-radius: 5px; }

  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--paper); border: 1px solid var(--paper-line); color: var(--ink-soft);
    font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 600; margin-right: 10px;
  }
  .rank-badge.gold { background: linear-gradient(145deg, var(--gold-bright), var(--gold)); color: var(--navy-deep); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,0.18); }

  .empty-msg { font-size: 13px; color: var(--ink-soft); text-align: center; padding: 26px 0; font-style: italic; }

  .detail-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--paper-line); }
  .detail-header .name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: var(--navy); }
  .semester-result { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 4px; }
  .semester-result strong { font-family: 'Fraunces', serif; font-size: 13.5px; color: var(--navy); font-weight: 600; }
  .semester-result span { font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  .subject-line { font-size: 12px; color: var(--ink-soft); }

  .cgpa-card {
    margin-top: 14px; background: var(--navy);
    background-image: radial-gradient(circle at 20% 20%, rgba(201,162,39,0.15), transparent 50%);
    border-radius: 8px; padding: 18px; text-align: center; position: relative; overflow: hidden;
  }
  .cgpa-card .label { font-family: 'Roboto Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 4px; }
  .cgpa-card .value { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; color: #fff; }

  .edit-row { display: grid; grid-template-columns: 1fr 66px 56px; gap: 6px; align-items: center; margin-bottom: 7px; }
  .edit-row input { margin-bottom: 0; }
  .save-mark-btn { background: var(--gold-soft); color: var(--navy-deep); border: none; border-radius: 6px; padding: 7px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .save-mark-btn:hover { background: var(--gold-bright); }

  .error-msg { color: var(--red); font-size: 12.5px; margin-top: 6px; }
  .success-msg { color: var(--green); font-size: 12.5px; margin-top: 6px; font-weight: 600; }

  footer {
    text-align: center; margin-top: 8px; padding: 18px 0 0;
    font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
    color: var(--ink-soft); text-transform: uppercase;
  }
  footer span { color: var(--gold); font-weight: 600; }

  @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sealPop { from { opacity: 0; transform: scale(0.5) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="masthead">
  <svg class="seal" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="27" stroke="#E6C158" stroke-width="2"/>
    <circle cx="30" cy="30" r="20" stroke="#E6C158" stroke-width="1"/>
    <path d="M30 16 L34 26 L45 26 L36 33 L39 44 L30 37 L21 44 L24 33 L15 26 L26 26 Z" fill="#E6C158"/>
  </svg>
  <span class="eyebrow">Academic Records &middot; Est. 2026</span>
  <h1>University Grading System</h1>
  <p>Semester GPA &amp; cumulative CGPA on a 4.0 scale</p>
</div>

<div class="container">
  <div class="content-wrap">

    <div class="tabs">
      <button class="tab-btn active" data-tab="add" onclick="switchTab('add')">Add Student</button>
      <button class="tab-btn" data-tab="list" onclick="switchTab('list')">All Students</button>
      <button class="tab-btn" data-tab="rank" onclick="switchTab('rank')">Ranking</button>
    </div>

    <!-- ADD STUDENT TAB -->
    <div id="tab-add" class="card">
      <div class="section-label">Student Details</div>
      <label for="studentName">Student name</label>
      <input type="text" id="studentName" placeholder="Enter student name">
      <div id="semesters"></div>
      <button class="btn btn-secondary" onclick="addSemester()">+ Add semester</button>
      <button class="btn btn-primary" onclick="saveStudent()">Save Student</button>
      <div id="addError"></div>
    </div>

    <!-- ALL STUDENTS TAB -->
    <div id="tab-list" class="card hidden">
      <div class="section-label">Enrolled Students</div>
      <div id="studentList"></div>
    </div>

    <!-- RANKING TAB -->
    <div id="tab-rank" class="card hidden">
      <div class="section-label">Ranked by CGPA</div>
      <div id="rankingList"></div>
    </div>

    <!-- STUDENT DETAIL VIEW -->
    <div id="detailPanel" class="card hidden"></div>

    <footer>Built by <span>Apu Paul</span></footer>
  </div>
</div>

<script>
let students = JSON.parse(localStorage.getItem('gradingStudents') || '{}');
let semesterCount = 0;
let subjectCounters = {};

function persist() {
  localStorage.setItem('gradingStudents', JSON.stringify(students));
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  ['add', 'list', 'rank'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('detailPanel').classList.add('hidden');
  const target = document.getElementById('tab-' + tab);
  target.classList.remove('hidden');
  if (tab === 'list') renderStudentList();
  if (tab === 'rank') renderRanking();
}

function addSemester() {
  semesterCount++;
  const semId = semesterCount;
  const div = document.createElement('div');
  div.className = 'semester-block';
  div.id = 'semester-' + semId;
  div.innerHTML = `
    <div class="semester-header">
      <span>Semester ${semId}</span>
      <button class="link-btn danger" onclick="document.getElementById('semester-${semId}').remove()">Remove</button>
    </div>
    <div id="subjects-${semId}"></div>
    <button class="link-btn" onclick="addSubject(${semId})">+ Add subject</button>
  `;
  document.getElementById('semesters').appendChild(div);
  addSubject(semId);
}

function addSubject(semId) {
  if (!subjectCounters[semId]) subjectCounters[semId] = 0;
  subjectCounters[semId]++;
  const subId = subjectCounters[semId];
  const row = document.createElement('div');
  row.className = 'subject-row';
  row.id = `subject-${semId}-${subId}`;
  row.innerHTML = `
    <input type="text" placeholder="Subject name" class="subject-name">
    <input type="number" placeholder="Marks" class="subject-marks" min="0" max="100">
    <button class="link-btn danger" onclick="document.getElementById('subject-${semId}-${subId}').remove()">&times;</button>
  `;
  document.getElementById('subjects-' + semId).appendChild(row);
}

function getGrade(marks) {
  if (marks >= 80) return { letter: "A+", point: 4.00 };
  if (marks >= 75) return { letter: "A", point: 3.75 };
  if (marks >= 70) return { letter: "A-", point: 3.50 };
  if (marks >= 65) return { letter: "B+", point: 3.25 };
  if (marks >= 60) return { letter: "B", point: 3.00 };
  if (marks >= 55) return { letter: "B-", point: 2.75 };
  if (marks >= 50) return { letter: "C+", point: 2.50 };
  if (marks >= 45) return { letter: "C", point: 2.25 };
  if (marks >= 40) return { letter: "D", point: 2.00 };
  return { letter: "F", point: 0.00 };
}

function saveStudent() {
  const errorDiv = document.getElementById('addError');
  errorDiv.innerHTML = '';
  const name = document.getElementById('studentName').value.trim();

  if (!name) {
    errorDiv.innerHTML = '<p class="error-msg">Please enter a student name.</p>';
    return;
  }

  const semesterBlocks = document.querySelectorAll('#semesters .semester-block');
  if (semesterBlocks.length === 0) {
    errorDiv.innerHTML = '<p class="error-msg">Add at least one semester.</p>';
    return;
  }

  const record = {};
  let hasError = false;

  semesterBlocks.forEach((block) => {
    const semName = block.querySelector('.semester-header span').textContent;
    const rows = block.querySelectorAll('.subject-row');
    const subjects = {};

    rows.forEach(row => {
      const subjName = row.querySelector('.subject-name').value.trim();
      const marksVal = row.querySelector('.subject-marks').value.trim();
      if (!subjName || marksVal === '') return;
      const marks = parseFloat(marksVal);
      if (isNaN(marks) || marks < 0 || marks > 100) { hasError = true; return; }
      subjects[subjName] = marks;
    });

    if (Object.keys(subjects).length > 0) record[semName] = subjects;
  });

  if (hasError) {
    errorDiv.innerHTML = '<p class="error-msg">Marks must be valid numbers between 0 and 100.</p>';
    return;
  }
  if (Object.keys(record).length === 0) {
    errorDiv.innerHTML = '<p class="error-msg">Add at least one subject with marks.</p>';
    return;
  }

  students[name] = record;
  persist();

  document.getElementById('studentName').value = '';
  document.getElementById('semesters').innerHTML = '';
  semesterCount = 0;
  subjectCounters = {};
  addSemester();
  errorDiv.innerHTML = `<p class="success-msg">${name} saved successfully.</p>`;
}

function calculateCGPA(name) {
  let totalPoints = 0, totalSubjects = 0;
  const semesterGPAs = {};

  for (const sem in students[name]) {
    let semPoints = 0, semCount = 0;
    for (const subj in students[name][sem]) {
      const marks = students[name][sem][subj];
      const g = getGrade(marks);
      semPoints += g.point; semCount++;
      totalPoints += g.point; totalSubjects++;
    }
    semesterGPAs[sem] = semCount > 0 ? semPoints / semCount : 0;
  }

  return {
    cgpa: totalSubjects > 0 ? totalPoints / totalSubjects : 0,
    semesterGPAs,
    subjectCount: totalSubjects
  };
}

function renderStudentList() {
  const container = document.getElementById('studentList');
  const names = Object.keys(students);

  if (names.length === 0) {
    container.innerHTML = '<p class="empty-msg">No students enrolled yet.</p>';
    return;
  }

  container.innerHTML = names.map(name => {
    const { cgpa, subjectCount } = calculateCGPA(name);
    return `
      <div class="student-item" onclick="showDetail('${name.replace(/'/g, "\\'")}')">
        <div>
          <div class="student-name">${name}</div>
          <div class="student-sub">${subjectCount} subject(s) recorded</div>
        </div>
        <div class="student-cgpa">${cgpa.toFixed(2)}</div>
      </div>
    `;
  }).join('');
}

function renderRanking() {
  const container = document.getElementById('rankingList');
  const names = Object.keys(students);

  if (names.length === 0) {
    container.innerHTML = '<p class="empty-msg">No students enrolled yet.</p>';
    return;
  }

  const ranked = names.map(name => ({ name, cgpa: calculateCGPA(name).cgpa }))
                       .sort((a, b) => b.cgpa - a.cgpa);

  container.innerHTML = ranked.map((s, i) => `
    <div class="student-item" onclick="showDetail('${s.name.replace(/'/g, "\\'")}')">
      <div style="display:flex;align-items:center;">
        <span class="rank-badge ${i === 0 ? 'gold' : ''}">${i + 1}</span>
        <span class="student-name">${s.name}</span>
      </div>
      <div class="student-cgpa">${s.cgpa.toFixed(2)}</div>
    </div>
  `).join('');
}

function showDetail(name) {
  ['add', 'list', 'rank'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');

  const { cgpa, semesterGPAs } = calculateCGPA(name);

  let semHtml = '';
  for (const sem in students[name]) {
    semHtml += `<div class="semester-result"><strong>${sem}</strong><span>GPA ${semesterGPAs[sem].toFixed(2)}</span></div>`;
    for (const subj in students[name][sem]) {
      const marks = students[name][sem][subj];
      const g = getGrade(marks);
      const rowId = `edit-${sem}-${subj}`.replace(/\s/g, '_');
      semHtml += `
        <div class="edit-row">
          <span class="subject-line">${subj} &middot; ${g.letter}</span>
          <input type="number" min="0" max="100" value="${marks}" id="${rowId}">
          <button class="save-mark-btn" onclick="updateMarks('${name.replace(/'/g,"\\'")}','${sem.replace(/'/g,"\\'")}','${subj.replace(/'/g,"\\'")}','${rowId}')">Save</button>
        </div>
      `;
    }
  }

  panel.innerHTML = `
    <div class="detail-header">
      <span class="name">${name}</span>
      <button class="link-btn" onclick="closeDetail()">Close</button>
    </div>
    ${semHtml}
    <div class="cgpa-card">
      <div class="label">Overall CGPA</div>
      <div class="value">${cgpa.toFixed(2)}</div>
    </div>
    <button class="btn btn-danger" style="margin-top:14px;" onclick="deleteStudent('${name.replace(/'/g,"\\'")}')">Delete Student</button>
  `;
}

function closeDetail() {
  document.getElementById('detailPanel').classList.add('hidden');
  document.getElementById('tab-list').classList.remove('hidden');
  renderStudentList();
}

function updateMarks(name, sem, subj, rowId) {
  const val = parseFloat(document.getElementById(rowId).value);
  if (isNaN(val) || val < 0 || val > 100) {
    alert('Please enter a valid mark between 0 and 100.');
    return;
  }
  students[name][sem][subj] = val;
  persist();
  showDetail(name);
}

function deleteStudent(name) {
  if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
  delete students[name];
  persist();
  closeDetail();
}

addSemester();
</script>

</body>
</html>
